# Hyprspace starter config.
#
# This file is intentionally small. Hyprspace already provides opinionated built-in
# defaults for the dwindle-friendly layout behavior, so this file only contains the
# first shortcuts new users are likely to want immediately.
#
# For a fuller reference config, see: ~/.config/hyprspace/docs/default-config.toml
# For path rules, see: ~/.config/hyprspace/docs/README.md
# For all available config options and commands, see:
# https://nikitabobko.github.io/AeroSpace/guide
# https://nikitabobko.github.io/AeroSpace/commands

config-version = 2
start-at-login = true
auto-reload-config = true

after-startup-command = [
    'exec-and-forget borders active_color=0xff50bfcb inactive_color=0xff414550 width=8.0 hidpi=off',
]

exec-on-workspace-change = [
    '/bin/bash',
    '-lc',
    '/opt/homebrew/bin/sketchybar --trigger hyprspace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE PREV_WORKSPACE=$AEROSPACE_PREV_WORKSPACE',
]

persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "0"]

# Hold alt and drag from anywhere inside a tiled window to move and reinsert it at the drop point.
[mouse-drag]
enabled = true
modifier = 'alt'

[gaps]
inner.horizontal = 18
inner.vertical = 18
outer.left = 18
outer.right = 18
outer.bottom = 18
outer.top = [{ monitor."built-in" = 18 }, { monitor."main" = 48 }, 48]

# ---------- MAIN KEY BINDINGS -----------

[mode.main.binding]
alt-enter = 'exec-and-forget /Users/rell/Nextcloud/code/mynixos/dotfiles/sd/mac/newwindow com.apple.Terminal "neues fenster" Terminal'
alt-rightSquareBracket = 'exec-and-forget /Users/rell/Nextcloud/code/mynixos/dotfiles/sd/mac/newwindow com.apple.finder "neues fenster" Finder'
alt-leftSquareBracket = 'exec-and-forget /Users/rell/Nextcloud/code/mynixos/dotfiles/sd/mac/newwindow org.mozilla.firefox "neues fenster" Firefox'
# alt-shift-p = 'open-terminal Ghostty btop' # quake like?

alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
